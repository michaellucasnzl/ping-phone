# Daemon JVM criteria intentionally not pinned.
#
# The previous content (toolchainVendor=jetbrains, toolchainVersion=21) required
# a JetBrains JDK 21 to be auto-detected or downloaded, but the foojay-resolver
# does not reliably provide a download URL for the daemon JVM, causing
# "No defined toolchain download url for LINUX on x86_64 architecture" on machines
# without a JetBrains JDK 21 already installed.
#
# Without criteria here, Gradle uses JAVA_HOME (or the system `java` on PATH, or
# Android Studio's "Gradle JDK" setting when run from the IDE). AGP 9.5 itself
# requires JDK 21+ to run the daemon, so point JAVA_HOME at a JDK 21+ install
# (e.g. Android Studio's bundled JBR: /opt/android-studio/jbr on Linux,
# /Applications/Android Studio.app/Contents/jbr/Contents/Home on macOS,
# C:\Program Files\Android\Android Studio\jbr on Windows).
#
# The bytecode target remains Java 17 (see compileOptions + kotlin.compilerOptions
# in app/build.gradle.kts).
